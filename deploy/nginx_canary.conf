# Canary split for the sentiment service: 95% stable (INT8), 5% candidate (student FP32).
# Written for the checklist; the candidate service is not built in this project.
events {}

http {
    upstream sentiment {
        # stable: INT8 bento on port 3000
        server 127.0.0.1:3000 weight=95;
        # candidate: second bento on port 3001
        server 127.0.0.1:3001 weight=5;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://sentiment;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            # p99 under load was about 6.4 s in Phase 13, so leave headroom
            proxy_read_timeout 30s;
        }
    }
}
