global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus_alerts.yml

scrape_configs:
  - job_name: sentiment-bento
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: psi-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
