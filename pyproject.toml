[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-sentiment"
version = "0.1.0"
description = "Arabic sentiment analysis for e-commerce reviews"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "torch",
    "transformers",
    "mlflow==3.10.1",
    "dvc[gdrive]>=3.67.1",
    "pyopenssl>=24.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pre-commit",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "arabic-reshaper",
    "python-bidi",
    "accelerate",
    "boto3>=1.43.115",
    "locust>=2.46.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.23.2",
    "bentoml>=1.4.40",
]

[tool.ruff]
line-length = 100
exclude = ["notebooks"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]  # T20 bans print()

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
