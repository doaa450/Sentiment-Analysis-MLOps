[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-sentiment"
version = "0.1.0"
description = "Arabic sentiment analysis for e-commerce reviews"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
